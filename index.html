<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mirror Within</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @keyframes shimmer { 100% { transform: translateX(100%); } }
        .animate-gradient-x {
            background-size: 200% 200%;
            animation: gradient-x 4s linear infinite;
        }
        @keyframes gradient-x {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body { background-color: #050505; margin: 0; overflow-x: hidden; color: white; font-family: system-ui, -apple-system, sans-serif; }
        .perspective-1000 { perspective: 1000px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { motion, AnimatePresence } = FramerMotion;
        const { 
            Sparkles, ArrowLeft, ShieldCheck, Heart, Zap, 
            Sunrise, Target, BrainCircuit, RefreshCcw, Activity 
        } = LucideReact;

        const QUESTIONS = [
            { id: 1, text: 'כשאתה עושה טעות, האם הקול הפנימי שלך מעודד אותך כמו חבר טוב במקום לבקר אותך בחומרה?', category: 'compassion' },
            { id: 2, text: 'האם קל לך להגיד "לא" לדברים שלא מתאימים לך, בלי להרגיש אשמה כבדה?', category: 'boundaries' },
            { id: 3, text: 'האם אתה מצליח לגלוש ברשתות חברתיות בלי להרגיש ש"החיים של אחרים טובים יותר משלי"?', category: 'comparison' },
            { id: 4, text: 'כשאתה מסתכל במראה, האם אתה מוצא לפחות דבר אחד שאתה אוהב במקום להתמקד רק בפגמים?', category: 'compassion' },
            { id: 5, text: 'כשמישהו מחמיא לך, האם אתה אומר "תודה" בביטחון במקום להצטנע או להסביר למה זה לא נכון?', category: 'confidence' },
            { id: 6, text: 'האם אתה נהנה מהזמן שלך עם עצמך (לבד) ומרגיש שזה ממלא אותך באנרגיה?', category: 'growth' },
            { id: 7, text: 'האם אתה מסוגל לשחרר טעויות מהעבר ולא "לטחון" אותן בראש שוב ושוב?', category: 'compassion' },
            { id: 8, text: 'האם אתה נותן עדיפות לצרכים הפיזיים והרגשיים שלך (שינה, אוכל טוב, מנוחה) גם כשאתה עמוס?', category: 'boundaries' },
            { id: 9, text: 'האם אתה חוגג ניצחונות קטנים של עצמך, גם אם אף אחד אחר לא רואה אותם?', category: 'confidence' },
            { id: 10, text: 'האם אתה מקבל החלטות לפי מה שטוב לך, ולא לפי מה ש"אנשים יגידו"?', category: 'comparison' },
            { id: 11, text: 'האם אתה סומך על תחושות הבטן שלך כשאתה צריך לקבל החלטה גדולה?', category: 'growth' },
            { id: 12, text: 'האם אתה משקיע זמן או כסף בלמידה ובצמיחה אישית כי אתה מאמין שמגיע לך להתפתח?', category: 'growth' },
            { id: 13, text: 'האם אתה מסוגל להקשיב לביקורת בלי להרגיש שכל הערך העצמי שלך קורס?', category: 'confidence' },
            { id: 14, text: 'האם אתה מאמין שיש לך את הכוח להתמודד עם אתגרים חדשים שהחיים יציבו לך?', category: 'confidence' },
            { id: 15, text: 'האם אתה מרגיש שאתה אדם בעל ערך, בלי קשר לכמה כסף יש לך או מה התפקיד שלך בעבודה?', category: 'comparison' },
            { id: 16, text: 'האם אתה מרגיש שלם עם הקצב האישי שלך בחיים, גם כשנראה שאחרים "מתקדמים" מהר יותר?', category: 'comparison' },
            { id: 17, text: 'האם אתה מרגיש בנוח לבקש עזרה כשקשה לך, מתוך הבנה שזה לא מוריד מהערך שלך?', category: 'boundaries' },
            { id: 18, text: 'האם אתה מרגיש הכרת תודה כלפי הגוף שלך על מה שהוא מאפשר לך לעשות, בלי קשר לנראות שלו?', category: 'compassion' }
        ];

        const OPTIONS = [
            { value: 1, label: 'בכלל לא' },
            { value: 2, label: 'לפעמים' },
            { value: 3, label: 'לרוב' },
            { value: 4, label: 'תמיד' }
        ];

        const CATEGORIES = {
            compassion: { label: 'חמלה וקבלה עצמית', color: '#40E0D0' },
            boundaries: { label: 'הצבת גבולות', color: '#38bdf8' },
            comparison: { label: 'שחרור מהשוואות', color: '#818cf8' },
            confidence: { label: 'ביטחון והישגים', color: '#c084fc' },
            growth: { label: 'צמיחה ואינטואיציה', color: '#f472b6' }
        };

        const AmbientParticles = () => {
            const particles = useMemo(() => Array.from({ length: 30 }).map((_, i) => ({
                id: i, x: Math.random() * 100, y: Math.random() * 100,
                size: Math.random() * 2 + 1, duration: Math.random() * 20 + 15, delay: Math.random() * 5,
            })), []);
            return (
                <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
                    {particles.map(p => (
                        <motion.div key={p.id} className="absolute rounded-full bg-[#40E0D0] blur-[1px]"
                            style={{ left: `${p.x}%`, top: `${p.y}%`, width: p.size, height: p.size }}
                            animate={{ y: ['0vh', '-100vh'], opacity: [0, 0.4, 0] }}
                            transition={{ duration: p.duration, repeat: Infinity, delay: p.delay, ease: "linear" }}
                        />
                    ))}
                </div>
            );
        };

        const AnimatedBackground = ({ mousePos }) => (
            <div className="fixed inset-0 overflow-hidden pointer-events-none z-0 bg-[#050505]">
                <motion.div className="absolute w-[800px] h-[800px] rounded-full blur-[120px] bg-gradient-to-r from-[#40E0D0] to-blue-900 mix-blend-screen opacity-20"
                    animate={{ x: mousePos.x * -30 - 400 + window.innerWidth / 2, y: mousePos.y * -30 - 400 + window.innerHeight / 2 }}
                    transition={{ type: 'tween', ease: 'easeOut', duration: 1 }}
                />
                <AmbientParticles />
            </div>
        );

        function App() {
            const [stage, setStage] = useState('landing');
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [answers, setAnswers] = useState({});
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });

            useEffect(() => {
                const handleMouseMove = (e) => setMousePos({ x: (e.clientX / window.innerWidth) * 2 - 1, y: (e.clientY / window.innerHeight) * 2 - 1 });
                window.addEventListener('mousemove', handleMouseMove);
                return () => window.removeEventListener('mousemove', handleMouseMove);
            }, []);

            const handleAnswer = (value) => {
                const newAnswers = { ...answers, [QUESTIONS[currentQuestion].id]: value };
                setAnswers(newAnswers);
                setTimeout(() => {
                    if (currentQuestion < QUESTIONS.length - 1) {
                        setCurrentQuestion(prev => prev + 1);
                    } else {
                        setStage('results');
                    }
                }, 400);
            };

            return (
                <div dir="rtl" className="min-h-screen text-white font-sans selection:bg-[#40E0D0] selection:text-black">
                    <AnimatedBackground mousePos={mousePos} />
                    <main className="relative z-10 min-h-screen flex flex-col items-center justify-center p-4">
                        <AnimatePresence mode="wait">
                            {stage === 'landing' && (
                                <motion.div key="landing" initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }} className="text-center">
                                    <h1 className="text-5xl md:text-7xl font-black mb-8 animate-gradient-x bg-gradient-to-r from-white via-[#40E0D0] to-white bg-clip-text text-transparent">THE MIRROR WITHIN</h1>
                                    <p className="text-xl mb-12 text-gray-300">גלה את רמת האהבה העצמית שלך במסע אינטראקטיבי</p>
                                    <button onClick={() => setStage('quiz')} className="bg-[#40E0D0] text-black px-12 py-5 rounded-full text-xl font-bold hover:scale-105 transition-all">התחל מסע</button>
                                </motion.div>
                            )}

                            {stage === 'quiz' && (
                                <motion.div key="quiz" initial={{ opacity: 0, x: 50 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -50 }} className="w-full max-w-2xl bg-black/60 backdrop-blur-xl p-8 rounded-3xl border border-white/10">
                                    <div className="mb-8 text-[#40E0D0] font-mono">שאלה {currentQuestion + 1} / {QUESTIONS.length}</div>
                                    <h2 className="text-2xl md:text-3xl mb-10 min-h-[100px]">{QUESTIONS[currentQuestion].text}</h2>
                                    <div className="space-y-4">
                                        {OPTIONS.map(opt => (
                                            <button key={opt.value} onClick={() => handleAnswer(opt.value)} className="w-full text-right p-5 rounded-xl border border-white/10 hover:bg-[#40E0D0]/20 hover:border-[#40E0D0]/50 transition-all group flex justify-between items-center">
                                                <span>{opt.label}</span>
                                                <div className="w-4 h-4 rounded-full border border-gray-500 group-hover:bg-[#40E0D0]"></div>
                                            </button>
                                        ))}
                                    </div>
                                </motion.div>
                            )}

                            {stage === 'results' && (
                                <motion.div key="results" initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="text-center max-w-2xl">
                                    <div className="inline-block p-4 rounded-full bg-[#40E0D0]/10 mb-6 border border-[#40E0D0]/30">
                                        <Activity className="w-12 h-12 text-[#40E0D0]" />
                                    </div>
                                    <h2 className="text-5xl font-bold text-[#40E0D0] mb-6">המסע הושלם</h2>
                                    <p className="text-xl text-gray-300 mb-10 leading-relaxed">תודה שהשתתפת במבדק. המודעות שלך היא הצעד הראשון לשינוי וצמיחה פנימית.</p>
                                    <button onClick={() => { setStage('landing'); setCurrentQuestion(0); }} className="border border-[#40E0D0] text-[#40E0D0] px-10 py-4 rounded-full hover:bg-[#40E0D0] hover:text-black transition-all">שוב מהתחלה</button>
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
